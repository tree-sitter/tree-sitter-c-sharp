name: Publish packages

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check-version:
    name: Check tag matches package versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Compare versions
        shell: python
        env:
          TAG: ${{github.ref_name}}
        run: |
          import json
          import os
          import sys
          import tomllib
          from pathlib import Path


          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))


          def read_toml(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))


          tag = os.environ["TAG"]
          expected = tag.removeprefix("v")
          versions = {
              "Cargo.toml": read_toml("Cargo.toml")["package"]["version"],
              "package.json": read_json("package.json")["version"],
              "pyproject.toml": read_toml("pyproject.toml")["project"]["version"],
              "tree-sitter.json": read_json("tree-sitter.json")["metadata"]["version"],
          }
          mismatches = {f: v for f, v in versions.items() if v != expected}
          for file, version in mismatches.items():
              print(f"::error file={file}::{file} has version {version}, but the tag is {tag}")
          sys.exit(1 if mismatches else 0)
  github:
    needs: check-version
    uses: tree-sitter/workflows/.github/workflows/release.yml@main
    with:
      generate: true
  npm:
    needs: check-version
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
    with:
      generate: true
  crates:
    needs: check-version
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      generate: true
  pypi:
    needs: check-version
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}
    with:
      generate: true
